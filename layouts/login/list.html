{{ define "main" }}
<div class="modal modal-auth modal-login in" id="login-modal" style="display: block; padding-right: 15px;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">&times;</button>
                <h2 id="welcomeloginModalLabel" class="modal-title text-center">Welcome to Comentarismo</h2>
                <h4 id="loginModalLabel" class="modal-title text-center">Please Log in to your account</h4>
            </div>
            <div class="modal-body">
                <div class="social-login text-center">
                    <ul class="social-buttons list-unstyled">
                        <li><a href="/auth/facebook" class="btn btn-social btn-facebook btn-block"><i
                                class="fa fa-facebook" aria-hidden="true"></i><span class="btn-text">Log in with Facebook</span></a>
                        </li>
                        <li><a href="/auth/twitter" class="btn btn-social btn-twitter btn-block"><i
                                class="fa fa-twitter" aria-hidden="true"></i><span
                                class="btn-text">Log in with Twitter</span></a></li>
                        <li><a href="/auth/gplus" class="btn btn-social btn-google btn-block"><i class="fa fa-google"
                                                                                                 aria-hidden="true"></i><span
                                class="btn-text">Log in with Google</span></a></li>
                        <li><a href="/auth/github" class="btn btn-social btn-github btn-block"><i class="fa fa-github"
                                                                                                  aria-hidden="true"></i><span
                                class="btn-text">Log in with GitHub</span></a></li>
                    </ul>
                </div>
                <div class="option-container">
                    <div class="lead-text">Don't have an account?</div>
                    <a class="signup-link btn btn-ghost-alt" id="signup-link" href="/signup">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/admin-dist/js/bootstrap.min.js"></script>
{{ end }}
