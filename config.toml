# Root-level Hugo config for tooling that expects config.toml in the repo root.
# The canonical split configuration remains under config/_default/.
baseURL = "https://comentarismo.com/"
title = "Comentarismo"
languageCode = "en"
defaultContentLanguage = "en"
enableRobotsTXT = true
disableKinds = ["RSS", "taxonomy", "taxonomyTerm", "term"]
cleanDestinationDir = true
disableAliases = true
taxonomies = {}

[outputs]
  home = ["HTML"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[params]
  description = "Comentarismo - Advanced comment analytics and moderation for publishers."
